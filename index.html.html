<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Code Editor</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #111827;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 1rem;
    }
    h1 {
      margin-bottom: 1rem;
      text-align: center;
    }
    .editor-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    @media (min-width: 768px) {
      .editor-container {
        flex-direction: row;
      }
    }
    .editor, .preview {
      flex: 1;
      border: 1px solid #374151;
      border-radius: 0.5rem;
      padding: 1rem;
      background: #1f2937;
      display: flex;
      flex-direction: column;
    }
    textarea {
      width: 100%;
      height: 300px;
      background: #111827;
      color: #f9fafb;
      border: none;
      outline: none;
      resize: vertical;
      font-family: monospace;
      font-size: 1rem;
      padding: 0.5rem;
      border-radius: 0.25rem;
    }
    iframe {
      flex: 1;
      border: none;
      background: white;
      border-radius: 0.25rem;
    }
    .controls {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .controls button {
      flex: 1;
      padding: 0.5rem;
      font-weight: bold;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    .controls button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <h1>Live HTML Code Editor</h1>
  <div class="editor-container">
    <div class="editor">
      <textarea id="code" placeholder="Write your HTML here...">
<!DOCTYPE html>
<html>
  <head>
    <title>Hello</title>
  </head>
  <body>
    <h1>Live Preview</h1>
    <p>This is a basic HTML preview.</p>
  </body>
</html>
      </textarea>
      <div class="controls">
        <button onclick="updatePreview()">Run</button>
        <button onclick="copyCode()">Copy</button>
        <button onclick="clearCode()">Clear</button>
        <button onclick="downloadCode()">Download</button>
      </div>
    </div>
    <div class="preview">
      <iframe id="preview"></iframe>
    </div>
  </div>

  <script>
    const codeInput = document.getElementById('code');
    const previewFrame = document.getElementById('preview');

    function updatePreview() {
      previewFrame.srcdoc = codeInput.value;
    }

    function copyCode() {
      codeInput.select();
      document.execCommand('copy');
      alert('Code copied to clipboard!');
    }

    function clearCode() {
      codeInput.value = '';
      updatePreview();
    }

    function downloadCode() {
      const blob = new Blob([codeInput.value], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'code.html';
      a.click();
      URL.revokeObjectURL(url);
    }

    // Auto-update preview on load
    updatePreview();
  </script>
</body>
</html>
